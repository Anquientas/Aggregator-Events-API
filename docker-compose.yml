services:
  database:
    container_name: "${DATABASE_POSTGRES_CONTAINER_NAME}"
    image: postgres:13.10
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE_NAME}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    networks:
      - custom_network
    volumes:
      - events_aggregator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USERNAME} -d ${POSTGRES_DATABASE_NAME}"]
      interval: 2s
      timeout: 2s
      retries: 10

  backend:
    # image: ghcr.io/OWNER/events-aggregator:latest
    build: .
    # pull_policy: always
    container_name: "${EVENTS_AGGREGATOR_CONTAINER_NAME}"
    restart: always
    environment:
      POSTGRES_DATABASE_NAME: ${POSTGRES_DATABASE_NAME}
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432
      EVENTS_PROVIDER_BASE_URL: ${EVENTS_PROVIDER_BASE_URL}
      EVENTS_PROVIDER_API_KEY: ${EVENTS_PROVIDER_API_KEY}
      WORKER_SYNC_INTERVAL: ${WORKER_SYNC_INTERVAL:-86400}
      SEATS_CACHE_TIMEOUT: ${SEATS_CACHE_TIMEOUT:-30}
      DEFAULT_PAGE_SIZE: ${DEFAULT_PAGE_SIZE:-20}
      CAPASHINO_BASE_URL: ${CAPASHINO_BASE_URL}
      CAPASHINO_API_KEY: ${CAPASHINO_API_KEY}
      OUTBOX_DISPATCH_INTERVAL: ${OUTBOX_DISPATCH_INTERVAL:-30}
      OUTBOX_MAX_ATTEMPTS: ${OUTBOX_MAX_ATTEMPTS:-5}
      OUTBOX_LIMIT_ROWS: ${OUTBOX_LIMIT_ROWS:-50}
      SENTRY_DSN: ${SENTRY_DSN}
    ports:
      - "${EVENTS_AGGREGATOR_PORT}:8000"
    networks:
      - custom_network
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
  
  prometheus:
    container_name: "${METRIC_PROMETHEUS_CONTAINER_NAME}"
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    networks:
      - custom_network
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
  
  grafana:
    container_name: "${METRIC_GRAFANA_CONTAINER_NAME}"
    image: grafana/grafana:latest
    ports:
      - "9091:3000"
    networks:
      - custom_network
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  events_aggregator_data:
    name: ${DATABASE_POSTGRES_VOLUME_NAME}
  prometheus-data:
    name: ${METRIC_PROMETHEUS_VOLUME_NAME}
  grafana-data:
    name: ${METRIC_GRAFANA_VOLUME_NAME}

networks:
  custom_network:
    driver: bridge
