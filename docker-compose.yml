services:
  database:
    container_name: "${DATABASE_CONTAINER_NAME}"
    image: postgres:13.10
    restart: always
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "${DATABASE_PORT}:5432"
    networks:
      - custom_network
    volumes:
      - wallets_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 2s
      timeout: 2s
      retries: 10

  backend:
    # Собранный в GitHub Actions образ (см. .github/workflows/ci-cd.yml).
    # Замените OWNER на владельца репозитория (аккаунт/организацию на GitHub, в нижнем регистре).
    # Для локальной сборки без registry используйте: docker compose up --build
    image: ghcr.io/OWNER/events-aggregator:latest
    build: .
    pull_policy: always
    container_name: "${EVENTS_AGGREGATOR_CONTAINER_NAME}"
    restart: always
    environment:
      DATABASE_NAME: ${DATABASE_NAME}
      DATABASE_USER: ${DATABASE_USER}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD}
      # Внутри сети docker-compose база доступна по имени сервиса, а не localhost
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      EVENTS_PROVIDER_BASE_URL: ${EVENTS_PROVIDER_BASE_URL:-http://student-system-events-provider-web.student-system-events-provider.svc:8000}
      EVENTS_PROVIDER_API_KEY: ${EVENTS_PROVIDER_API_KEY:-}
    ports:
      - "${EVENTS_AGGREGATOR_PORT}:8000"
    networks:
      - custom_network
    depends_on:
      database:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  wallets_data:
    name: ${DATABASE_VOLUME_NAME}

networks:
  custom_network:
    driver: bridge
