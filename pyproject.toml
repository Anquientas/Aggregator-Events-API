[project]
name = "events-aggregator"
version = "0.1.0"
description = "Агрегатор событий: синхронизация с Events Provider API, локальное хранение и регистрация на мероприятия"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "alembic>=1.13",
]

[dependency-groups]
dev = [
    "ruff>=0.7",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-httpx>=0.30",
    "pytest-xdist>=3.6",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 78
target-version = "py313"
src = ["app", "tests"]
extend-exclude = ["alembic",]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4"]
ignore = ["B008", "UP046"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
