name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Run ruff check
        run: uv run ruff check .

  test:
    name: Tests (pytest)
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"

      - name: Install dependencies
        run: uv sync --group dev

      - name: Check Alembic migrations load correctly
        env:
          DATABASE_NAME: ci
          DATABASE_USER: ci
          DATABASE_PASSWORD: ci
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
        run: uv run alembic upgrade head --sql

      - name: Run pytest
        env:
          # Тестам реальный Postgres не нужен (см. tests/conftest.py — своя SQLite
          # на тест), но Settings при импорте требует эти переменные заданными.
          DATABASE_NAME: ci
          DATABASE_USER: ci
          DATABASE_PASSWORD: ci
          DATABASE_HOST: localhost
          DATABASE_PORT: "5432"
        run: uv run pytest -v

  # Собирает образ и пушит в GitHub Container Registry (ghcr.io).
  # Аутентификация — через встроенный GITHUB_TOKEN, отдельный секрет заводить не нужно.
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image_name.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        id: image_name
        run: |
          echo "image=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.image_name.outputs.image }}:latest
            ${{ steps.image_name.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy over SSH
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ${{ needs.build-and-push.outputs.image }}
          DATABASE_NAME: ${{ secrets.DATABASE_NAME }}
          DATABASE_USER: ${{ secrets.DATABASE_USER }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
          EVENTS_PROVIDER_API_KEY: ${{ secrets.EVENTS_PROVIDER_API_KEY }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
          EVENTS_PROVIDER_BASE_URL: ${{ vars.EVENTS_PROVIDER_BASE_URL }}
          EVENTS_PROVIDER_TIMEOUT: ${{ vars.EVENTS_PROVIDER_TIMEOUT }}
          WORKER_SYNC_INTERVAL: ${{ vars.WORKER_SYNC_INTERVAL }}
          SEATS_CACHE_TIMEOUT: ${{ vars.SEATS_CACHE_TIMEOUT }}
          DEFAULT_PAGE_SIZE: ${{ vars.DEFAULT_PAGE_SIZE }}
          DATABASE_PORT: ${{ vars.DATABASE_PORT }}
          DATABASE_CONTAINER_NAME: ${{ vars.DATABASE_CONTAINER_NAME }}
          EVENTS_AGGREGATOR_CONTAINER_NAME: ${{ vars.EVENTS_AGGREGATOR_CONTAINER_NAME }}
          DATABASE_VOLUME_NAME: ${{ vars.DATABASE_VOLUME_NAME }}
          EVENTS_AGGREGATOR_PORT: ${{ vars.EVENTS_AGGREGATOR_PORT }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: >-
            IMAGE,DATABASE_NAME,DATABASE_USER,DATABASE_PASSWORD,EVENTS_PROVIDER_API_KEY,
            GHCR_ACTOR,GHCR_TOKEN,
            EVENTS_PROVIDER_BASE_URL,EVENTS_PROVIDER_TIMEOUT,WORKER_SYNC_INTERVAL,
            SEATS_CACHE_TIMEOUT,DEFAULT_PAGE_SIZE,DATABASE_PORT,DATABASE_CONTAINER_NAME,
            EVENTS_AGGREGATOR_CONTAINER_NAME,DATABASE_VOLUME_NAME,EVENTS_AGGREGATOR_PORT
          script: |
            set -e
            mkdir -p ~/events-aggregator
            cd ~/events-aggregator

            if [ ! -f docker-compose.yml ]; then
              echo "docker-compose.yml не найден на сервере — скопируйте его один раз"
              echo "вручную (scp docker-compose.yml сервер:~/events-aggregator/) перед первым деплоем."
              exit 1
            fi

            cat > .env <<ENVEOF
            DATABASE_NAME=$DATABASE_NAME
            DATABASE_USER=$DATABASE_USER
            DATABASE_PASSWORD=$DATABASE_PASSWORD
            DATABASE_HOST=database
            DATABASE_PORT=$DATABASE_PORT
            EVENTS_PROVIDER_BASE_URL=$EVENTS_PROVIDER_BASE_URL
            EVENTS_PROVIDER_API_KEY=$EVENTS_PROVIDER_API_KEY
            EVENTS_PROVIDER_TIMEOUT=$EVENTS_PROVIDER_TIMEOUT
            WORKER_SYNC_INTERVAL=$WORKER_SYNC_INTERVAL
            SEATS_CACHE_TIMEOUT=$SEATS_CACHE_TIMEOUT
            DEFAULT_PAGE_SIZE=$DEFAULT_PAGE_SIZE
            DATABASE_CONTAINER_NAME=$DATABASE_CONTAINER_NAME
            EVENTS_AGGREGATOR_CONTAINER_NAME=$EVENTS_AGGREGATOR_CONTAINER_NAME
            DATABASE_VOLUME_NAME=$DATABASE_VOLUME_NAME
            EVENTS_AGGREGATOR_PORT=$EVENTS_AGGREGATOR_PORT
            ENVEOF
            chmod 600 .env

            sed -i "s#^\s*image:.*events-aggregator.*#    image: ${IMAGE}:latest#" docker-compose.yml || true

            if [ -n "$GHCR_TOKEN" ]; then
              echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_ACTOR" --password-stdin
            fi
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
