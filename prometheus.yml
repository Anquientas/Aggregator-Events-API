global:
  scrape_interval: 15s      # Как часто собирать метрики
  evaluation_interval: 15s   # Как часто проверять алерты

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'event-aggregator'
    static_configs:
      - targets: ['localhost:8000']